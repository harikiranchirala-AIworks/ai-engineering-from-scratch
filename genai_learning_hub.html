    ["What is the main difference between pretraining and fine-tuning?", "Pretraining is self-supervised learning on vast text to learn world knowledge and language; fine-tuning adapts that base model to specific tasks or instruction-following behaviors using smaller, curated datasets."],

{"t": "Agents & Architecture", "m": 7, "q": "Human-in-the-Loop (HITL) Interrupt Gates \u2014 How do they differ and when is each used?", "a": "LangGraph uses persistent state checkpointers to pause execution before high-risk actions (e.g. financial transactions, database writes, email sending), surfaces the state diff to a human reviewer, and resumes or modifies state upon approval.", "w": "Crucial production requirement in enterprise compliance, healthcare, and financial services.", "x": "Allowing agents to execute destructive write tools without human confirmation gates.", "f": "How do you implement time-travel debugging and human state overrides in LangGraph?"},
{"t": "Agents & Architecture", "m": 7, "q": "Agent Memory: Ephemeral vs Semantic vs Checkpoint \u2014 How do they differ and when is each used?", "a": "Ephemeral memory lives in context window during a session; Semantic memory uses vector stores to retrieve past user preferences across sessions; Checkpoint memory snapshots exact execution graphs for failure recovery.", "w": "Tests architectural understanding of multi-tiered memory systems in long-running agent swarms.", "x": "Stuffing infinite historical conversation logs into the prompt until context length limits crash the agent.", "f": "How do you prevent context window exhaustion in multi-turn 50-step agent executions?"},
{"t": "Agents & Architecture", "m": 7, "q": "Tool Schema Hallucination & MCP Discovery \u2014 How do they differ and when is each used?", "a": "When LLMs hallucinate non-existent tool parameters or invoke the wrong API schema. Model Context Protocol (MCP) prevents this by providing JSON-RPC standardized schema discovery directly from the tool server.", "w": "Tests real-world debugging experience with tool-calling LLMs in production.", "x": "Providing ambiguous, paragraph-long tool descriptions that confuse the model's tool selection.", "f": "How do you write tool docstrings to maximize parameter extraction accuracy?"},
{"t": "AI PM & Strategy", "m": 11, "q": "Build vs Buy Decision Matrix for Enterprise AI \u2014 How do you structure this framework?", "a": "Use commercial APIs (OpenAI/Claude/Gemini) when validating fast time-to-market or complex reasoning is needed; Build fine-tuned open-source models (vLLM/Llama 3) when data privacy is mandatory, offline edge deployment is needed, or volume exceeds millions of tokens/day where open-source cuts cost by 70%.", "w": "Core strategic interview question for AI Product Managers and Tech Leads.", "x": "Defaulting to self-hosting a 70B model before proving customer demand.", "f": "At what monthly token threshold does self-hosting an open-source model become cheaper than API calls?"},
{"t": "AI PM & Strategy", "m": 11, "q": "Evaluating Non-Deterministic AI Product Metrics \u2014 How do you structure this framework?", "a": "Traditional software uses deterministic pass/fail; AI products require a 3-tier evaluation framework: 1) System Level (Latency P95, Cost per query, Uptime), 2) Model Quality (RAGAS Faithfulness, Semantic Recall, Toxicity), 3) Business Outcome (Task completion rate, human escalation rate, CSAT).", "w": "Tests whether a PM can establish measurable KPIs for probabilistic generative systems.", "x": "Relying purely on informal 'vibe checks' rather than automated LLM-as-a-judge benchmark suites.", "f": "How would you design a continuous evaluation pipeline for a production customer support agent?"},
{"t": "AI PM & Strategy", "m": 11, "q": "AI Guardrails, Hallucination SLA, and Legal Liability \u2014 How do you structure this framework?", "a": "Define strict acceptable error bounds per use case: 0% tolerance on PII leakage and safety interlocks (handled via hardcoded deterministic regex/rules); <2% acceptable hallucination on RAG answers (handled via ground truth citation checks and confidence thresholds).", "w": "Crucial for enterprise governance and risk mitigation.", "x": "Treating all model hallucinations equally instead of risk-weighting by business impact.", "f": "How do you explain hallucination risk and mitigation strategies to non-technical executive stakeholders?"},
  {"t":"Python","m":1,"q":"What's the difference between a list and a generator in Python, and when would you use each?","a":"A list stores all items in memory at once; a generator produces items lazily, one at a time, on demand. Use a list when you need random access or to iterate multiple times. Use a generator when processing large or streaming data (like reading a huge log file or streaming LLM tokens) where holding everything in memory would be wasteful.","w":"Tests whether you understand memory efficiency — critical when processing large documents for RAG pipelines.","x":"Saying generators are 'just slower lists' instead of explaining the memory tradeoff.","f":"How would you build a generator that streams tokens from an LLM response as they arrive?"},
  {"t":"Python","m":1,"q":"Explain Python's GIL (Global Interpreter Lock) and how it affects AI backend performance.","a":"The GIL allows only one thread to execute Python bytecode at a time, even on multi-core machines. This means CPU-bound multithreading doesn't speed things up in pure Python. For AI backends, this matters less for I/O-bound work (API calls to LLMs, DB queries) where async/await or multiprocessing is used instead of threads for true parallelism.","w":"Tests whether you understand why FastAPI uses async instead of threads for scaling LLM API calls.","x":"Claiming Python 'can't do parallelism at all' — multiprocessing and async both work around the GIL for different workload types.","f":"When would you choose multiprocessing over asyncio for a CPU-heavy preprocessing step in a RAG pipeline?"},
  {"t":"Python","m":1,"q":"What is a decorator, and where might you use one in an AI Engineering codebase?","a":"A decorator wraps a function to extend its behavior without modifying its code. In AI Engineering, decorators are commonly used for retry logic on flaky LLM API calls, caching expensive embedding calls, timing/logging requests, and enforcing authentication on FastAPI routes.","w":"Tests practical Python fluency beyond syntax — decorators show up constantly in production AI code.","x":"Writing a decorator that swallows exceptions silently instead of logging or re-raising them.","f":"How would you write a decorator that retries an LLM API call up to 3 times with exponential backoff?"},
  {"t":"Python","m":1,"q":"What's the difference between `async def` and a regular `def` function, and what happens if you call a blocking operation inside an async function?","a":"`async def` defines a coroutine that can pause and resume, allowing other tasks to run while it waits (e.g. for an API response). If you call a blocking operation (like a synchronous `requests.get()`) inside it, it blocks the entire event loop, stalling every other concurrent request your server is handling — a common and severe FastAPI production bug.","w":"Tests whether candidates understand async pitfalls, which silently destroy throughput in production.","x":"Mixing sync and async code without realizing the sync call blocks the whole event loop.","f":"How would you call a blocking, synchronous SDK from inside an async FastAPI route safely?"},
  {"t":"ML Fundamentals","m":2,"q":"Explain the bias-variance tradeoff using a simple analogy.","a":"Bias is how wrong your model's assumptions are on average (underfitting — like a dart player who always throws too far left). Variance is how much your predictions swing with different training data (overfitting — like a player whose throws scatter wildly with no consistency). The goal is low bias and low variance — consistent and centered.","w":"A classic conceptual check — interviewers want a clear explanation, not textbook jargon.","x":"Defining both terms correctly but failing to connect them to overfitting/underfitting in practice.","f":"How would you detect whether a model is suffering from high bias versus high variance using a learning curve?"},
  {"t":"ML Fundamentals","m":2,"q":"What's the difference between precision and recall, and when would you prioritize one over the other?","a":"Precision measures how many of your positive predictions were actually correct (avoiding false alarms). Recall measures how many actual positives you caught (avoiding misses). Prioritize precision when false positives are costly (e.g. flagging legitimate content as harmful); prioritize recall when false negatives are costly (e.g. missing a fraud case).","w":"Tests whether you can apply metrics to real product decisions, not just define them.","x":"Saying accuracy is always the right metric — it's misleading on imbalanced datasets.","f":"How would F1-score help you balance precision and recall in an evaluation pipeline?"},
  {"t":"ML Fundamentals","m":2,"q":"What is overfitting, and name two practical ways to reduce it.","a":"Overfitting is when a model learns the noise/quirks of training data instead of generalizable patterns, performing well on training data but poorly on new data. Practical fixes: regularization (penalizing complexity) and cross-validation combined with more/better training data or early stopping.","w":"Foundational concept that underlies why evaluation sets must be separate from training data.","x":"Only mentioning 'get more data' without naming a concrete technique like regularization or early stopping.","f":"How does this concept relate to evaluating an LLM-based system — can an LLM 'overfit' to your test set?"},
  {"t":"ML Fundamentals","m":2,"q":"What's the difference between supervised and unsupervised learning, and where does RAG-style retrieval fit?","a":"Supervised learning trains on labeled input-output pairs (e.g. spam/not spam). Unsupervised learning finds structure in unlabeled data (e.g. clustering). Retrieval in RAG isn't really either — it's closer to a similarity search problem using embeddings, often built on top of unsupervised representation learning (the embedding model itself).","w":"Checks if you can place GenAI techniques within the broader ML taxonomy, not just treat them as separate magic.","x":"Saying RAG is 'supervised learning' because it 'uses labeled documents' — documents aren't labels in the supervised sense.","f":"How would you use supervised learning to improve a RAG system's reranking step?"},
  {"t":"Deep Learning","m":3,"q":"Why was the attention mechanism invented, and what problem did it solve in older architectures like RNNs?","a":"RNNs process sequences step-by-step and struggle to retain information from far back in a sequence (the 'vanishing gradient' / long-range dependency problem). Attention lets a model directly weigh and access any position in the input regardless of distance, solving long-range dependency issues and enabling parallelization, since attention doesn't require sequential processing.","w":"This is the single most common deep learning interview question for AI Engineering roles.","x":"Explaining attention mechanically (the math) without explaining the problem it solved — interviewers want the 'why' first.","f":"How does this connect to why Transformers can be trained in parallel while RNNs cannot?"},
  {"t":"Deep Learning","m":3,"q":"What is backpropagation, in plain English?","a":"Backpropagation is how a neural network learns from its mistakes: it calculates how much each weight contributed to the final error, then nudges each weight slightly to reduce that error, working backward from the output layer to the input layer.","w":"Tests baseline deep learning literacy — you don't need to derive it, but you must be able to explain it simply.","x":"Diving into calculus notation instead of giving the plain-English version first.","f":"Why don't AI Engineers usually need to implement backpropagation themselves day-to-day?"},
  {"t":"Deep Learning","m":3,"q":"What's the difference between a neural network's training and inference phases, and why does this distinction matter for production AI systems?","a":"Training is when the model learns from data by adjusting weights (expensive, done once or periodically). Inference is using the already-trained model to make predictions on new input (what happens every time a user sends a message to an LLM). Production AI Engineers spend the vast majority of their time optimizing for fast, cheap inference — not training.","w":"Confirms you understand why 'production AI Engineering' rarely means training models from scratch.","x":"Conflating fine-tuning with full training when discussing 'how' production models get updated.","f":"How would inference latency change between a 7B parameter model and a 70B parameter model, and why?"},
  {"t":"Deep Learning","m":3,"q":"What does 'context window' mean, and what tradeoffs come with a longer context window?","a":"The context window is the maximum number of tokens (input + output) a model can process in a single call. Longer context windows let you feed in more information (entire documents, long chat history), but increase compute cost and latency, and can suffer from the 'lost in the middle' problem, where models attend less reliably to information buried in the middle of a long context.","w":"Directly tests understanding of a constraint every AI Engineer designs around daily.","x":"Assuming a bigger context window always means you should stuff in more text instead of retrieving relevant chunks.","f":"How does the 'lost in the middle' problem influence how you'd design a RAG system's prompt structure?"},
  {"t":"Transformers","m":4,"q":"Explain self-attention in one clear analogy.","a":"Self-attention is like every word in a sentence quickly 'glancing around' at every other word to decide how much each one matters for understanding its own meaning. In 'The trophy didn't fit in the suitcase because it was too small,' self-attention helps the model figure out 'it' refers to the suitcase, not the trophy, by weighing relationships between all words simultaneously.","w":"The most-asked Transformer question — tests whether you have real intuition versus memorized definitions.","x":"Describing the Query/Key/Value math without ever giving an intuitive picture first.","f":"How does multi-head attention extend this idea beyond a single attention calculation?"},
  {"t":"Transformers","m":4,"q":"What is positional encoding, and why is it necessary in Transformers?","a":"Unlike RNNs, Transformers process all tokens in parallel rather than sequentially, so they have no inherent sense of word order. Positional encoding injects information about each token's position into its embedding, so the model knows 'dog bites man' is different from 'man bites dog' even though it sees both words at once.","w":"Checks if you understand a subtle but critical architectural detail often glossed over.","x":"Assuming token order is automatically preserved just because tokens are fed in order — the model needs explicit positional signals.","f":"What's the difference between absolute and rotary positional encodings (RoPE), and why do most modern LLMs use the latter?"},
  {"t":"Transformers","m":4,"q":"What's the architectural difference between BERT and GPT, and why does it matter for choosing a model?","a":"BERT is encoder-only and bidirectional — it sees the whole input at once, making it great for understanding tasks (classification, embeddings). GPT is decoder-only and autoregressive — it generates text one token at a time, looking only at previous tokens, making it suited for generation tasks (chat, completion). Choose based on the task: classification/embeddings → BERT-style; open-ended generation → GPT-style.","w":"Common question to see if you understand why different model families exist instead of treating 'LLM' as one undifferentiated thing.","x":"Saying BERT 'can't be used for generation at all' — it's a hard constraint of design intent more than literal impossibility.","f":"Why are most embedding models today derived from BERT-style architectures rather than GPT-style ones?"},
  {"t":"Transformers","m":4,"q":"What causes hallucinations in LLMs at an architectural level?","a":"LLMs are trained to predict the statistically most plausible next token, not to verify factual truth. When the model lacks grounded information (or the prompt doesn't supply it), it still generates a fluent, plausible-sounding continuation — which may be factually wrong. This is a direct consequence of how Transformers are trained, not a bug to be 'patched' away entirely.","w":"Tests whether candidates understand hallucination as a fundamental property, which shapes how you'd mitigate (not eliminate) it.","x":"Claiming hallucinations can be 'fully solved' with a clever prompt — mitigated, not eliminated, is the accurate framing.","f":"How does grounding the model with RAG reduce — but not eliminate — hallucination risk?"},
  {"t":"Embeddings","m":6,"q":"What is an embedding, and why is cosine similarity used to compare them instead of, say, Euclidean distance?","a":"An embedding is a dense numeric vector representing the semantic meaning of text (or other data) in a high-dimensional space, where similar meanings sit close together. Cosine similarity measures the angle between two vectors, which captures semantic similarity regardless of vector magnitude — important because embedding magnitude can vary without changing meaning. Euclidean distance is sometimes used too, but cosine is the default for most text embedding use cases.","w":"Tests both conceptual understanding and a practical implementation detail used in every vector search system.","x":"Saying cosine similarity is 'always better' without explaining why magnitude-independence matters for text embeddings specifically.","f":"In what scenario might Euclidean distance actually be preferred over cosine similarity?"},
  {"t":"Embeddings","m":6,"q":"How do you choose between a smaller (e.g. 384-dim) and larger (e.g. 1536-dim) embedding model for a production RAG system?","a":"It's a tradeoff between retrieval quality, storage cost, and latency. Larger embeddings often capture more nuance but cost more to store and search, and are slower at scale. For many practical RAG use cases, smaller embeddings perform nearly as well at a fraction of the cost — the right choice depends on benchmarking retrieval quality against your actual documents, not assuming bigger is automatically better.","w":"Tests cost-awareness, a key signal of production maturity versus pure-research thinking.","x":"Defaulting to the largest/most expensive embedding model 'to be safe' without benchmarking against the actual use case.","f":"How would you benchmark two embedding models against each other on your specific document set?"},
  {"t":"Embeddings","m":6,"q":"What happens when you embed a query versus embedding a document — are they treated the same way?","a":"Often yes, using the same embedding model and process, but some embedding models support asymmetric embedding (different encoding for queries versus documents), which can improve retrieval relevance, since questions and the documents that answer them aren't always phrased the same way.","w":"A more advanced question that tests whether you understand subtleties beyond 'just call the embed function.'","x":"Assuming all embedding models treat query and document embedding identically — some explicitly don't.","f":"What's the 'query-document mismatch' problem in semantic search, and how does hybrid search help with it?"},
  {"t":"Embeddings","m":6,"q":"Can embeddings go stale, and how would you handle that in production?","a":"Yes — if you switch or update your embedding model, previously stored embeddings become incompatible (they live in a different vector space) and must be regenerated. Even without switching models, the underlying source documents can change, requiring re-embedding to keep retrieval accurate.","w":"Tests operational thinking — many beginners never consider embedding lifecycle management.","x":"Updating the embedding model in production without re-embedding the entire existing vector store first.","f":"How would you design a zero-downtime migration when switching to a new embedding model in production?"},
  {"t":"Vector Databases","m":6,"q":"What is ANN (Approximate Nearest Neighbor) search, and why is it used instead of exact search?","a":"ANN search finds vectors that are very likely (but not guaranteed) to be the closest matches, using index structures like HNSW, instead of comparing a query against every single vector (exact search), which becomes too slow at scale. ANN trades a small amount of accuracy for massive speed gains, often retrieving 10,000x faster with negligible quality loss.","w":"Core conceptual question for any vector database role — explains why these systems can scale.","x":"Implying ANN always returns the perfect nearest neighbor — it's explicitly approximate, by design, for speed.","f":"What's the role of the HNSW algorithm specifically in enabling fast ANN search?"},
  {"t":"Vector Databases","m":6,"q":"How would you decide between FAISS, ChromaDB, Pinecone, and Qdrant for a project?","a":"FAISS is a fast, in-memory library best for prototyping or smaller-scale, self-managed deployments. ChromaDB is developer-friendly and great for local development or small production use. Pinecone is a fully managed, hosted service ideal when you don't want to manage infrastructure and need to scale quickly. Qdrant offers a strong balance of open-source flexibility, self-hosting or managed options, and rich metadata filtering for production use cases.","w":"This exact question is asked in nearly every AI Engineer interview that touches RAG.","x":"Picking a tool because it's popular rather than justifying it against your project's scale, hosting preference, and budget.","f":"How would your choice change if the project needed strict metadata filtering combined with vector search?"},
  {"t":"Vector Databases","m":6,"q":"What is metadata filtering in a vector database, and why is it important for production RAG?","a":"Metadata filtering lets you narrow a vector search using structured attributes (e.g. 'date > 2025', 'department = legal') alongside the semantic similarity search. It's important because pure vector search alone can't enforce business rules like access control or recency — combining both gives accurate and compliant results.","w":"Checks whether you understand RAG systems need more than 'just vectors' to work in real organizations.","x":"Building RAG retrieval with no metadata filtering, leading to results leaking across departments/users or surfacing stale data.","f":"How would you implement document-level access control in a multi-tenant RAG system using metadata filtering?"},
  {"t":"Vector Databases","m":6,"q":"What is index rebuilding, and why might it be necessary in a vector database?","a":"As vectors are added, updated, or deleted, the underlying index structure (like HNSW) can become less efficient or need maintenance to keep search quality and speed optimal. Index rebuilding refreshes this structure, similar to how a traditional database periodically reindexes for performance. Most managed vector DBs handle this automatically, but it's a real operational consideration in self-hosted setups.","w":"Tests operational/production awareness beyond 'demo-level' vector DB usage.","x":"Assuming vector indexes never need maintenance once built, especially in high-churn, frequently-updated datasets.","f":"How would high delete/update frequency in your dataset influence your choice of vector database?"},
  {"t":"RAG Fundamentals","m":6,"q":"Walk through the full RAG pipeline, end to end, for a single user query.","a":"1) The user's query is embedded into a vector. 2) That vector is used to search a vector database for the most semantically similar document chunks. 3) The top-k retrieved chunks are inserted into a prompt template alongside the original query. 4) This combined prompt is sent to the LLM, which generates an answer grounded in the retrieved context, often with citations back to the source chunks.","w":"The single most common RAG interview question — tests whether you actually understand the mechanism, not just the buzzword.","x":"Skipping the chunking/embedding step and jumping straight to 'the LLM searches the documents' — the LLM doesn't search; retrieval happens before generation.","f":"What would you change in this pipeline if retrieval quality was poor but generation quality was fine?"},
  {"t":"RAG Fundamentals","m":6,"q":"Why does chunk size matter so much in RAG, and how would you choose one?","a":"Chunks that are too small lose context (a sentence ripped from its paragraph may be ambiguous); chunks too large dilute relevance (the embedding represents a mix of relevant and irrelevant content, hurting retrieval precision). The right chunk size depends on document structure — start with a few hundred tokens with overlap, then tune based on actual retrieval evaluation on your own documents, not a generic default.","w":"Tests applied judgment, not just textbook knowledge of 'chunking exists.'","x":"Using one fixed chunk size for vastly different document types (legal contracts vs. chat transcripts) without testing.","f":"How does chunk overlap help mitigate context loss at chunk boundaries?"},
  {"t":"RAG Fundamentals","m":6,"q":"What is the difference between RAG and simply fine-tuning a model on your data?","a":"RAG retrieves relevant information at query time and feeds it into the prompt — knowledge stays external, easily updatable, and traceable to a source. Fine-tuning bakes information into the model's weights, which is harder to update, can't easily cite sources, and risks the model 'forgetting' other capabilities. RAG is generally preferred for frequently-changing, fact-based knowledge; fine-tuning is better for teaching a model a style, format, or specialized skill.","w":"One of the highest-value distinctions to nail in any GenAI interview.","x":"Treating fine-tuning as 'just a better version of RAG' — they solve different problems and are often combined, not substitutes.","f":"In what scenario would you combine both RAG and fine-tuning in the same system?"},
  {"t":"RAG Fundamentals","m":6,"q":"What does it mean when a RAG system is 'unfaithful,' and how would you detect it?","a":"Unfaithfulness means the generated answer includes claims not actually supported by the retrieved context — the model is hallucinating despite being given grounding information. You'd detect this using faithfulness metrics (like in RAGAS), which check whether each claim in the answer can be traced back to the retrieved chunks, or through manual spot-checking against sources.","w":"Tests whether you connect RAG mechanics to evaluation — many beginners never check faithfulness at all.","x":"Assuming RAG automatically prevents hallucination just because retrieval happened — the LLM can still ignore or misuse retrieved context.","f":"How would faithfulness scoring change your prompt design if you found the model frequently ignoring retrieved context?"},
  {"t":"Advanced RAG","m":6,"q":"What is hybrid search, and why might it outperform pure vector search?","a":"Hybrid search combines keyword-based search (like BM25) with vector/semantic search, then merges the results (often via a weighted score or reranking step). Pure vector search can miss exact keyword matches (like product codes, names, or rare terms) that aren't well represented semantically — hybrid search captures both semantic similarity and exact-match precision.","w":"A go-to question for assessing whether you've moved beyond naive RAG.","x":"Assuming pure semantic search is always sufficient — it commonly fails on exact terms, codes, or acronyms.","f":"How would you weight the combination between keyword and vector scores in a hybrid search system?"},
  {"t":"Advanced RAG","m":6,"q":"What does a reranker do, and where does it sit in the RAG pipeline?","a":"A reranker takes the initial set of retrieved candidates (e.g. top 20-50 from vector search) and re-scores them using a more precise, often cross-encoder, model that directly compares the query against each candidate — producing a smaller, higher-quality top-k (e.g. top 5) to feed into the LLM. It sits between retrieval and generation, trading a bit of latency for significantly better relevance.","w":"Tests understanding of multi-stage retrieval architecture used in nearly all serious production RAG systems.","x":"Conflating reranking with the initial retrieval step — they're separate stages with different models and purposes.","f":"Why is it computationally infeasible to rerank your entire document corpus instead of just the initial retrieved candidates?"},
  {"t":"Advanced RAG","m":6,"q":"What is the 'lost in the middle' problem, and how do advanced RAG techniques address it?","a":"LLMs tend to pay less attention to information placed in the middle of a long context window, performing better when relevant information is near the beginning or end. Advanced RAG techniques address this by keeping retrieved context concise (via reranking/compression) and strategically ordering the most relevant chunks near the start or end of the prompt rather than burying them in the middle.","w":"A nuanced question that separates candidates with hands-on production RAG experience from those who've only built demos.","x":"Assuming a longer context window automatically solves this — context length and attention reliability are separate issues.","f":"How does context compression help reduce the impact of the lost-in-the-middle problem?"},
  {"t":"Advanced RAG","m":6,"q":"What is Corrective RAG (CRAG), and what problem does it solve?","a":"Corrective RAG adds a self-evaluation step after retrieval: the system checks whether retrieved documents are actually relevant/sufficient before generating an answer. If retrieval quality is judged poor, it can trigger a fallback (like a web search or query rewrite) instead of generating an answer from weak, irrelevant context — reducing hallucination caused by bad retrieval.","w":"Shows whether you're current on 2025/2026-era advanced RAG patterns, not just 2023-era basics.","x":"Describing CRAG as just 'better prompting' — it's an architectural pattern with an explicit relevance-checking step, not a prompt trick.","f":"How would you implement the relevance-checking step in CRAG — what would you use to judge retrieval quality programmatically?"},
  {"t":"Prompt Engineering","m":5,"q":"What's the difference between zero-shot, few-shot, and chain-of-thought prompting?","a":"Zero-shot gives the model only an instruction with no examples. Few-shot includes a handful of example input-output pairs in the prompt to guide format/style. Chain-of-thought explicitly asks the model to reason step-by-step before answering, which improves performance on multi-step reasoning tasks by giving the model 'room to think' before committing to a final answer.","w":"Foundational prompting question, often a quick warm-up before deeper RAG/agent questions.","x":"Treating chain-of-thought as always superior — it adds latency/cost and isn't needed for simple lookup-style tasks.","f":"When would few-shot prompting actually hurt performance compared to zero-shot?"},
  {"t":"Prompt Engineering","m":5,"q":"Why would you use structured/JSON output mode instead of free-text generation?","a":"Structured output guarantees the response conforms to a defined schema, making it directly parseable by downstream code (no fragile regex/string-parsing of free text). This is essential when an LLM's output feeds into another system — like an agent's tool-call arguments or a database insert — where malformed output would break the pipeline.","w":"Tests practical engineering judgment about reliability in production systems, not just prompting cleverness.","x":"Using free text and then trying to parse structured data out of it with regex — fragile and a frequent source of production bugs.","f":"What happens if the model returns output that doesn't conform to your requested JSON schema, and how would you handle it?"},
  {"t":"Prompt Engineering","m":5,"q":"What is self-consistency prompting, and when is it worth the extra cost?","a":"Self-consistency runs the same prompt multiple times (often with some randomness/temperature) and takes a majority vote or aggregates the answers, improving reliability on tasks with a single correct answer (like math or factual questions) at the cost of multiple LLM calls. It's worth it for high-stakes or error-prone tasks where extra latency/cost is acceptable in exchange for higher accuracy.","w":"Tests whether you understand prompting techniques as cost/accuracy tradeoffs, not free wins.","x":"Applying self-consistency to every single call regardless of task — it multiplies cost and isn't justified for simple, low-stakes queries.","f":"How would you decide the number of samples to use for self-consistency voting in a cost-sensitive production system?"},
  {"t":"Prompt Engineering","m":5,"q":"What's a guardrail in the context of prompt engineering, and give a concrete example.","a":"A guardrail is a constraint — either in the prompt itself or as a separate validation step — that keeps the model's output within safe, expected boundaries. A concrete example: instructing the model to refuse to answer outside a defined domain, combined with a post-generation check that flags or blocks responses containing disallowed content before they reach the user.","w":"Tests awareness of safety/reliability concerns expected in any production AI Engineering role.","x":"Relying solely on prompt instructions as the only guardrail — prompts can be bypassed; real systems need separate validation layers too.","f":"Why is relying purely on prompt-based guardrails risky, and what would you add as a second layer of defense?"},
  {"t":"LangChain","m":7,"q":"What is LCEL (LangChain Expression Language), and what problem does it solve?","a":"LCEL is a declarative syntax for composing LangChain components (prompts, models, retrievers, parsers) into pipelines using a simple `|` (pipe) operator, similar to Unix pipes. It solves the problem of verbose, imperative chain-building code by making chains more readable, composable, and easier to stream/parallelize.","w":"Common entry-level LangChain question to confirm hands-on familiarity, not just name recognition.","x":"Describing LCEL as 'just syntax sugar' without mentioning its built-in support for streaming, batching, and async execution.","f":"How does LCEL support streaming output differently from a manually written chain?"},
  {"t":"LangChain","m":7,"q":"What is a Runnable in LangChain, and why does almost everything inherit from it?","a":"A Runnable is LangChain's standard interface for any component that can be invoked, batched, streamed, or composed — prompts, models, retrievers, and output parsers all implement it. This uniform interface is what makes LCEL's pipe-based composition (`|`) possible, since any Runnable can be connected to any other Runnable predictably.","w":"Tests deeper framework understanding beyond surface-level usage.","x":"Treating Runnables and chains as unrelated concepts instead of understanding chains are built from composed Runnables.","f":"How would you build a custom Runnable to wrap a piece of business logic that isn't built into LangChain?"},
  {"t":"LangChain","m":7,"q":"When would you choose NOT to use LangChain for a project?","a":"When the use case is a single, simple LLM call with no chaining, retrieval, or tool use — the abstraction overhead isn't worth it. Also in latency- or performance-critical production paths, where some teams drop to raw provider SDKs for tighter control and fewer dependencies, using LangChain mainly for prototyping and exploration.","w":"A favorite senior-level question — shows maturity beyond 'I know how to use the tool.'","x":"Presenting LangChain as a mandatory tool for every GenAI project regardless of complexity.","f":"What would you lose, and what would you gain, by replacing a LangChain RAG chain with raw API calls in production?"},
  {"t":"LangChain","m":7,"q":"How does memory work in LangChain, and what's the difference between short-term and long-term memory implementations?","a":"Memory in LangChain stores conversational context so the model can reference earlier turns. Short-term memory typically holds recent messages in-session (often in application state or Redis). Long-term memory persists across sessions, often backed by a database or vector store, allowing the system to recall facts about a user from previous, separate conversations.","w":"Tests whether you connect framework-level memory concepts to the broader memory-systems chapter (databases/Redis).","x":"Treating all 'memory' as the same thing — short-term session memory and long-term persistent memory solve very different problems.","f":"How would you design memory so an agent remembers a user's preferences across multiple separate sessions, weeks apart?"},
  {"t":"AI Agents","m":7,"q":"Explain the ReAct pattern in agent design.","a":"ReAct (Reason + Act) interleaves the model's reasoning ('I should look up the current weather') with actual tool actions ('call the weather API') and observations ('it's 72°F'), repeating this loop until the model decides it has enough information to give a final answer. This lets the agent break complex tasks into reasoning-and-acting steps instead of trying to answer everything in one shot.","w":"The foundational agent pattern question — almost guaranteed in any agent-focused interview.","x":"Describing ReAct as just 'tool calling' without mentioning the explicit reasoning step interleaved between actions.","f":"What happens if an agent gets stuck in a reasoning loop, repeatedly calling the same tool without converging on an answer?"},
  {"t":"AI Agents","m":7,"q":"What's the difference between a single-agent system and a multi-agent system, and when would you choose multi-agent?","a":"A single agent handles all reasoning and tool use itself, which works well for moderately complex tasks. A multi-agent system splits responsibilities across specialized agents (e.g. a researcher agent, a writer agent, a critic agent) coordinated by an orchestrator. Choose multi-agent when a task is complex enough that specialization improves quality, or when you want clearer separation of concerns and easier debugging of each agent's role.","w":"Tests system design thinking applied specifically to agentic architectures.","x":"Defaulting to multi-agent for every task — it adds coordination complexity and cost that isn't always justified.","f":"How would you decide where to draw the boundary between two specialized agents in a multi-agent pipeline?"},
  {"t":"AI Agents","m":7,"q":"What is 'reflection' in agent design, and how does it improve output quality?","a":"Reflection is when an agent reviews and critiques its own output (or a draft answer) before finalizing it, catching errors, gaps, or quality issues — similar to a human re-reading their own work. This often improves output quality at the cost of extra LLM calls and latency, and is most valuable for tasks where correctness matters more than speed.","w":"Checks whether you know agent quality-improvement techniques beyond basic ReAct.","x":"Assuming reflection always improves results — it can also introduce unnecessary changes or amplify minor agent inconsistencies if not carefully scoped.","f":"How would you decide whether a reflection step is worth its added latency for a given agent task?"},
  {"t":"AI Agents","m":7,"q":"What are common failure modes of AI agents in production, and how would you guard against them?","a":"Common failures include: infinite reasoning loops (no convergence), hallucinated tool arguments (calling a tool with invalid/made-up parameters), wrong tool selection when multiple tools overlap in purpose, and runaway cost from excessive tool calls. Guardrails include setting a maximum iteration limit, validating tool arguments before execution, scoping each tool's purpose narrowly, and logging/monitoring every tool call for cost and correctness.","w":"A staple system-design-style question for agent roles — tests production readiness, not theoretical knowledge.","x":"Describing agents as reliable 'out of the box' without acknowledging these well-known failure modes exist.","f":"How would you design a maximum-iteration safeguard without prematurely cutting off a legitimately complex multi-step task?"},
  {"t":"LangGraph","m":7,"q":"What problem does LangGraph solve that a basic agent loop doesn't?","a":"A basic agent loop (like simple ReAct) has implicit, often opaque control flow — it's hard to inspect, debug, or customize the exact sequence of steps. LangGraph makes control flow explicit by modeling the workflow as a graph of nodes (steps) and edges (transitions), with a shared state object passed between nodes — giving you precise control, easier debugging, and the ability to add conditional branches or human checkpoints.","w":"The defining LangGraph question — tests whether you understand its purpose beyond 'it's LangChain's agent tool.'","x":"Saying LangGraph 'replaces' LangChain — they're complementary; LangGraph often uses LangChain components inside its nodes.","f":"How would you visualize and debug a LangGraph execution that produced an unexpected final state?"},
  {"t":"LangGraph","m":7,"q":"What is 'state' in LangGraph, and why is it shared across nodes?","a":"State is a structured object (often a typed dictionary or schema) that's passed through the graph, accumulating information as each node executes — for example, conversation history, intermediate results, or tool outputs. It's shared so every node has access to the full context built up so far, enabling coordinated, stateful multi-step workflows rather than isolated, stateless function calls.","w":"Tests core architectural understanding required to build any non-trivial LangGraph workflow.","x":"Treating each node as fully independent and forgetting that state changes from one node persist and affect later nodes.","f":"How would you design state to support a multi-agent graph where each agent should only see a relevant subset of the full state?"},
  {"t":"LangGraph","m":7,"q":"What is human-in-the-loop in LangGraph, and why is it important for production agent systems?","a":"Human-in-the-loop adds explicit checkpoints in the graph where execution pauses for human review or approval before continuing — for example, pausing before an agent sends an email or executes a financial transaction. It's important because fully autonomous agents can make costly or irreversible mistakes; human checkpoints add a safety net for high-stakes actions.","w":"Tests whether candidates think about safety/control in agentic systems, a major hiring concern in 2026.","x":"Building fully autonomous agents for high-stakes actions (payments, deletions, emails) without any human checkpoint.","f":"How would you design a LangGraph workflow so it pauses for approval only on high-risk actions, not every single step?"},
  {"t":"LangGraph","m":7,"q":"How does conditional routing work in LangGraph?","a":"Conditional routing uses a function that inspects the current state and decides which node to execute next, instead of following a fixed, linear sequence. For example, after a 'classify intent' node, a conditional edge routes the workflow to a 'billing agent' node or a 'support agent' node depending on the classified intent stored in state.","w":"Tests practical, hands-on graph-building knowledge beyond conceptual understanding.","x":"Hardcoding routing logic inside a node's business logic instead of using LangGraph's explicit conditional edge mechanism — makes the graph harder to visualize and debug.","f":"How would you handle a case where the conditional routing function itself fails or returns an unexpected value?"},
  {"t":"MCP","m":7,"q":"What problem does MCP (Model Context Protocol) solve?","a":"Before MCP, every AI application needed custom, one-off integration code to connect an LLM to each external tool or data source, creating an M×N integration problem (M applications, N tools, all needing bespoke glue code). MCP standardizes this with a common client-server protocol, so any MCP-compatible client (AI app) can use any MCP-compatible server (tool/data source) without custom integration work — often described as 'USB-C for AI tools.'","w":"The defining MCP question for 2026 interviews — expect this in almost every agentic systems interview now.","x":"Describing MCP as 'just another tool-calling format' without explaining the standardization/interoperability problem it actually solves.","f":"How does MCP's standardization change the way you'd architect a system using multiple third-party tools?"},
  {"t":"MCP","m":7,"q":"What are the three core primitives exposed by an MCP server?","a":"Tools (functions the AI can call to take action, like querying a database), Resources (data the AI can read, like files or documents), and Prompts (reusable prompt templates the server can expose for clients to use). Together these let an MCP server expose both capabilities (tools) and context (resources) in a structured way.","w":"Tests whether you've actually read the MCP spec rather than just heard the buzzword.","x":"Conflating tools and resources — tools perform actions; resources provide read-only context/data.","f":"When would you expose something as a Resource instead of a Tool, given they can sometimes overlap in purpose?"},
  {"t":"MCP","m":7,"q":"What security risks come with exposing tools via MCP, and how would you mitigate them?","a":"Risks include over-broad tool permissions (e.g. an 'execute any SQL' tool that could be misused for data exfiltration or destructive operations), and untrusted MCP servers potentially returning malicious or manipulated data that could influence the agent's behavior (a form of prompt injection via tool output). Mitigations include scoping each tool narrowly to a specific, safe action, validating/sanitizing tool outputs before they reach the model, and only connecting to trusted, vetted MCP servers.","w":"A heavily weighted question in 2026 interviews given the rapid, security-sensitive adoption of MCP in production.","x":"Assuming MCP servers are inherently safe simply because they follow the protocol spec — the protocol doesn't guarantee the server's implementation is secure.","f":"How would you design an approval step for high-risk MCP tool calls, similar to human-in-the-loop in LangGraph?"},
  {"t":"MCP","m":7,"q":"How is MCP different from a regular REST API?","a":"A REST API is a generic way for any client to talk to any server over HTTP, with no inherent concept of 'AI context.' MCP is purpose-built for AI applications: it standardizes how an LLM-based client discovers available tools/resources/prompts from a server and structures interactions specifically for an AI agent's reasoning loop — it can be implemented over different transports (including HTTP) but adds AI-specific semantics on top.","w":"Tests whether you understand MCP as a specialized layer rather than 'just an API' rebranded.","x":"Treating MCP and REST as competing, mutually exclusive technologies rather than recognizing MCP servers can themselves be built using REST/HTTP under the hood.","f":"Could you wrap an existing REST API as an MCP server? What would that involve?"},
  {"t":"Evaluation Frameworks","m":6,"q":"What's the difference between faithfulness and answer relevance in RAG evaluation?","a":"Faithfulness measures whether the generated answer's claims are actually supported by the retrieved context (no hallucination relative to the source material). Answer relevance measures whether the answer actually addresses the user's original question, regardless of whether it's grounded. A response can be faithful but irrelevant (correctly reflects retrieved content that doesn't answer the question), or relevant but unfaithful (answers the right question but hallucinates details).","w":"One of the most important and frequently tested RAG evaluation distinctions.","x":"Treating these as a single combined 'quality score' instead of measuring them as separate, independent dimensions.","f":"How would a low faithfulness score but high relevance score change your debugging priorities?"},
  {"t":"Evaluation Frameworks","m":6,"q":"What is LLM-as-judge, and what's a risk of using it for evaluation?","a":"LLM-as-judge uses a (often more capable) LLM to score or compare the outputs of your system against criteria you define, instead of relying purely on rigid automated metrics. This scales evaluation without requiring large amounts of human-labeled data. A key risk is that the judge model has its own biases and blind spots — it may favor certain styles (like verbosity) or share the same failure modes as the model being evaluated, so its scores should be validated against human judgment periodically.","w":"Tests awareness of a widely used but imperfect modern evaluation technique.","x":"Treating LLM-as-judge scores as ground truth without periodic human spot-checking to validate the judge's reliability.","f":"How would you validate that your LLM judge's scores actually correlate with real human quality assessments?"},
  {"t":"Evaluation Frameworks","m":6,"q":"What's the purpose of tracing tools like LangSmith or Phoenix in an AI system?","a":"Tracing tools capture and visualize the full execution path of a request — every prompt, retrieval call, tool call, and intermediate output — making it possible to debug exactly why a system produced a particular (often wrong) answer, instead of guessing from the final output alone.","w":"Tests whether you understand observability as essential infrastructure, not a 'nice to have.'","x":"Debugging production AI issues purely by re-running the same query and 'eyeballing' the result, without any tracing/logging of intermediate steps.","f":"How would tracing help you distinguish between a retrieval failure and a generation failure in a broken RAG response?"},
  {"t":"Evaluation Frameworks","m":6,"q":"How would you build a basic evaluation harness for a new RAG feature before shipping it?","a":"Create a labeled test set of realistic questions with expected answers (or expected source documents), run your pipeline against each, and score the outputs using a mix of automated metrics (like RAGAS faithfulness/relevance) and a smaller set of manual reviews to catch issues automated metrics might miss. Run this harness on every meaningful change to detect regressions before they reach production.","w":"A practical, build-it-yourself question that filters for hands-on production experience.","x":"Shipping a RAG feature based only on a handful of manually 'looks good' spot checks, with no repeatable test set.","f":"How would you decide how many test cases are 'enough' for a reliable evaluation harness on a new feature?"},
  {"t":"LLMOps","m":8,"q":"What is prompt versioning, and why does it matter in production?","a":"Prompt versioning treats prompts like code — tracked in version control, with clear history of changes — so you can trace exactly which prompt version produced a given output, roll back a regression, and run A/B comparisons between prompt versions. Without it, prompt changes become untraceable, making debugging quality regressions nearly impossible.","w":"A foundational LLMOps practice that's frequently overlooked by beginners but expected by interviewers.","x":"Editing prompts directly in a config file or database with no change history or rollback capability.","f":"How would you set up an automated check that runs your eval suite whenever a prompt is changed, before it reaches production?"},
  {"t":"LLMOps","m":8,"q":"What is model drift in the context of LLM-based systems, and how is it different from classical ML drift?","a":"In classical ML, drift usually refers to changes in the input data distribution making a trained model less accurate over time. In LLM systems, 'drift' often refers to the underlying foundation model itself changing — a provider silently updates their model (e.g. a new GPT or Claude version) which can shift your system's behavior and quality without any change on your end.","w":"Tests awareness of an LLM-specific operational risk that doesn't exist in the same form in classical ML.","x":"Assuming your system's behavior is fixed forever since 'you didn't change anything' — the underlying model provider can change things outside your control.","f":"How would you detect that a provider's silent model update has degraded your system's output quality?"},
  {"t":"LLMOps","m":8,"q":"Why would you build a CI/CD pipeline specifically for prompts and evaluation, not just for application code?","a":"Because prompt changes can break system behavior just as much as code changes can, but traditional software CI/CD doesn't test for things like hallucination rate, faithfulness, or output format compliance. A dedicated eval-aware CI pipeline runs your test set automatically on prompt or model changes, catching quality regressions before they reach users — extending standard software engineering discipline to a new kind of 'logic' (prompts).","w":"Tests whether you bring real software engineering rigor into the GenAI-specific parts of your stack.","x":"Treating prompt changes as 'just text edits' that don't need the same review/testing discipline as code changes.","f":"What metrics would you include as required gates in this CI pipeline before allowing a prompt change to merge?"},
  {"t":"LLMOps","m":8,"q":"What's the role of monitoring/observability dashboards in an LLMOps setup, beyond just tracing individual requests?","a":"While tracing helps debug individual requests, monitoring dashboards aggregate metrics over time — latency trends, cost per request, hallucination rate, user feedback signals — to spot systemic issues (like a gradual quality decline) that wouldn't be obvious from looking at any single trace.","w":"Distinguishes whether you understand the difference between debugging (tracing) and ongoing health monitoring (dashboards).","x":"Relying only on individual trace inspection and never aggregating metrics to spot slow, systemic degradation over time.","f":"What metric would most quickly alert you to a sudden cost spike caused by a runaway agent loop in production?"},
  {"t":"AI System Design","m":9,"q":"How would you reduce latency in a production RAG chatbot without sacrificing answer quality?","a":"Several levers: use a smaller/faster embedding model for retrieval, cache frequent queries and their embeddings, stream tokens to the user instead of waiting for the full response, use a faster (but still capable) LLM for simpler queries and route only complex ones to a larger model, and parallelize retrieval and any independent preprocessing steps where possible.","w":"A core AI system design question — tests whether you can reason about multiple levers, not just one fix.","x":"Jumping straight to 'use a smaller model' without considering caching, streaming, or routing strategies first.","f":"How would semantic caching specifically help reduce latency and cost for a high-traffic chatbot with repetitive query patterns?"},
  {"t":"AI System Design","m":9,"q":"What is semantic caching, and how is it different from regular key-based caching?","a":"Regular caching matches on exact keys (the same literal query returns a cached result). Semantic caching matches on meaning — using embeddings to detect that a new query is semantically similar enough to a previously cached query, even if worded differently, and serving the cached response (or a close variant) instead of calling the LLM again.","w":"A favorite system design question that distinguishes AI-specific architecture knowledge from generic backend knowledge.","x":"Assuming regular exact-match caching is sufficient for an LLM chatbot, where users phrase the same question many different ways.","f":"What risk does semantic caching introduce if the similarity threshold is set too loosely?"},
  {"t":"AI System Design","m":9,"q":"How would you design a system to handle a sudden 10x spike in traffic to an LLM-powered API?","a":"Use auto-scaling for your application layer, implement request queuing with backpressure so the system degrades gracefully instead of crashing, add rate limiting per user/API key to prevent abuse, leverage caching (especially semantic caching) to absorb repeated queries, and have a fallback strategy (like a smaller/faster model or a 'system is busy' message) if the primary LLM provider becomes rate-limited or slow under load.","w":"Classic system design question adapted for AI-specific failure modes (LLM provider rate limits being a unique constraint).","x":"Designing only for your own infrastructure scaling while ignoring that the upstream LLM provider itself can become a bottleneck or rate-limit you under load.","f":"How would your fallback strategy differ if the spike was legitimate user growth versus a sudden burst of abusive/bot traffic?"},
  {"t":"AI System Design","m":9,"q":"How would you architect memory for an AI assistant that needs to remember user preferences across many separate conversations over months?","a":"Use short-term memory (recent conversation turns) held in fast storage like Redis for the active session, and long-term memory (durable facts and preferences about the user) stored in a database, often summarized or extracted via an LLM step rather than storing raw transcripts indefinitely. Retrieval of relevant long-term memories at the start of a new session (often via semantic search over stored memory entries) lets the assistant 'recall' relevant context without re-processing the user's entire history every time.","w":"A staff-level system design question that tests integration of memory systems, databases, and RAG-like retrieval together.","x":"Storing full raw conversation transcripts indefinitely and re-feeding them all into every new conversation — expensive, slow, and a context window/cost nightmare.","f":"How would you decide what information is important enough to promote from short-term to long-term memory?"},
  {"t":"FastAPI","m":8,"q":"How would you implement token-by-token streaming for an LLM chat response in FastAPI?","a":"Use a `StreamingResponse` with an async generator function that yields each token (or chunk) as it arrives from the LLM provider's streaming API, typically using Server-Sent Events (SSE) format so the frontend can render tokens incrementally as they're generated, instead of waiting for the full response.","w":"One of the most commonly asked practical FastAPI questions in AI Engineering interviews.","x":"Building a synchronous endpoint that waits for the full LLM response before returning anything — defeats the purpose of streaming and feels slow to users.","f":"What changes would you need to make on the frontend to properly consume an SSE streaming endpoint?"},
  {"t":"FastAPI","m":8,"q":"Why does FastAPI use Pydantic models for request/response validation, and what's the benefit in an AI application specifically?","a":"Pydantic models define and enforce a strict schema for incoming requests and outgoing responses, automatically validating types and structure, and rejecting malformed requests before they reach your business logic. In AI applications, this is especially valuable for enforcing structured outputs (e.g. ensuring an agent's tool-call response matches an expected schema) and catching bad input early, before it wastes an expensive LLM call.","w":"Tests understanding of why FastAPI specifically (versus other frameworks) is well suited to AI backends.","x":"Skipping request validation and trusting the LLM's raw output will always match the expected format — leads to silent failures downstream.","f":"How would you use a Pydantic model to enforce that an LLM's structured output matches an exact expected schema?"},
  {"t":"FastAPI","m":8,"q":"What's the difference between a background task and a Celery task in FastAPI, and when would you use each?","a":"FastAPI's built-in `BackgroundTasks` run after a response is sent, within the same process, suitable for lightweight, fire-and-forget work (like sending a notification). Celery runs tasks in a separate worker process/queue (often backed by Redis), suitable for longer-running, more resource-intensive, or retryable work (like processing a large document for embedding) that shouldn't block or risk crashing your API server.","w":"Tests practical architecture decisions around async task processing — a common real-world gap in beginner projects.","x":"Using FastAPI's lightweight BackgroundTasks for heavy, long-running jobs that can crash the request process or get lost if the server restarts.","f":"How would you handle task failure and retries for a long-running document-embedding job using Celery?"},
  {"t":"FastAPI","m":8,"q":"How would you implement rate limiting on a public-facing LLM-powered API endpoint?","a":"Use a rate-limiting middleware or library (like `slowapi`) backed by Redis to track request counts per user/API key/IP within a time window, returning a 429 status when the limit is exceeded. This is critical for LLM-backed APIs specifically because unmetered access can quickly translate into very real, very large API costs from your underlying LLM provider.","w":"Tests cost-awareness and production hardening — a frequent gap in beginner AI projects deployed publicly.","x":"Deploying a publicly accessible LLM API endpoint with no rate limiting, leaving it open to abuse and unexpected billing.","f":"How would you differentiate rate limits between free-tier and paid users of the same API?"},
  {"t":"Databases & Memory","m":7,"q":"Why is PostgreSQL commonly chosen over other databases for AI application backends?","a":"PostgreSQL is a mature, reliable relational database with strong support for structured data (users, chat history, metadata), JSON columns for semi-structured data, and extensions like pgvector that let you store and query embeddings directly inside the same database — reducing the need for a fully separate vector database in many use cases.","w":"Tests whether you know practical database choices beyond 'just use a vector DB for everything.'","x":"Assuming you always need a dedicated vector database — for smaller-scale RAG use cases, pgvector inside PostgreSQL is often sufficient and simpler to operate.","f":"When would pgvector inside PostgreSQL be insufficient, requiring a dedicated vector database like Qdrant or Pinecone instead?"},
  {"t":"Databases & Memory","m":7,"q":"What's the role of Redis in an AI application's architecture?","a":"Redis is an in-memory key-value store used for fast, ephemeral data: caching LLM responses, storing short-term session/conversation state, rate-limiting counters, and task queues (often paired with Celery). Its speed makes it ideal for data that needs frequent, low-latency access but doesn't need the durability guarantees of a full relational database.","w":"A common practical question testing whether you understand why two different databases are typically used together.","x":"Using Redis as the sole, permanent storage for important data like conversation history — Redis is not designed as a durable system of record by default.","f":"How would you design a fallback if Redis becomes temporarily unavailable in production — should your application fail completely?"},
  {"t":"Databases & Memory","m":7,"q":"What's the difference between async and sync database access in a Python AI backend, and why does it matter?","a":"Sync database calls block the calling thread/event loop until the query completes. Async database access (e.g. using SQLAlchemy 2.0's async engine with asyncpg) allows the application to handle other requests while waiting on the database, which is essential in a FastAPI app handling many concurrent LLM-related requests — blocking database calls can stall your entire async event loop, just like a blocking LLM API call would.","w":"Reinforces the async theme that runs through Python, FastAPI, and database layers together — frequently tested in combination.","x":"Using a synchronous database driver/ORM setup inside an otherwise async FastAPI application, accidentally blocking the event loop.","f":"What async-compatible driver would you use to connect to PostgreSQL from an async SQLAlchemy setup?"},
  {"t":"Databases & Memory","m":7,"q":"How would you design the schema for storing chat conversation history that needs to support both short-term context retrieval and long-term analytics?","a":"Store individual messages with conversation/session IDs, timestamps, role (user/assistant/system), and any relevant metadata (like token counts or model used) in a normalized table. For short-term context, query the most recent N messages for a given session. For long-term analytics, the same structured data supports aggregate queries (volume, common topics, model usage) without needing a separate system — good schema design upfront avoids needing to migrate later.","w":"A practical schema design question that tests whether you think beyond 'just dump messages somewhere.'","x":"Storing entire conversations as a single unstructured JSON blob, making both targeted retrieval and analytics needlessly difficult later.","f":"How would this schema change if you needed to support multiple LLM providers being used within the same conversation?"},
  {"t":"Deployment & Production","m":8,"q":"What retry strategy would you implement for calls to an LLM provider's API, and why?","a":"Implement exponential backoff with jitter: retry failed calls (especially rate-limit or transient server errors) with increasing wait times between attempts, plus a small random jitter to avoid multiple clients retrying in lockstep and overwhelming the provider simultaneously. Cap the maximum number of retries and have a clear fallback (like an error message or a backup model) if all retries fail.","w":"A very common practical question — interviewers want to see you've actually handled real provider rate limits, not just theorized about them.","x":"Retrying immediately and aggressively without any backoff — this can worsen rate-limiting issues instead of resolving them.","f":"How would jitter specifically help avoid a 'thundering herd' problem when many clients hit a rate limit simultaneously?"},
  {"t":"Deployment & Production","m":8,"q":"What should you log when debugging a production AI application, and what should you avoid logging?","a":"Log: request/response metadata, latency, which model/prompt version was used, retrieved context summaries (for RAG), and error details. Avoid logging: full user PII unnecessarily, full raw prompts/responses in plaintext logs if they may contain sensitive data (or do so with proper access controls and redaction), and API keys/secrets — ever.","w":"Tests both debugging practicality and a basic awareness of privacy/security hygiene in logging.","x":"Logging full user conversations or PII in plaintext without access controls, creating compliance and privacy risk.","f":"How would you balance the need for detailed debugging logs with user privacy requirements like GDPR?"},
  {"t":"Deployment & Production","m":8,"q":"What's the purpose of a staging environment for an AI application, and what's different about testing AI features there compared to traditional software?","a":"A staging environment mirrors production for safe testing before release. For AI features specifically, staging should also run your evaluation harness (faithfulness, relevance, regression checks) against realistic data — not just functional/unit tests — since AI quality issues (hallucination, wrong tone, poor retrieval) won't be caught by traditional pass/fail testing alone.","w":"Tests whether you extend standard software practices (staging environments) to account for AI-specific quality dimensions.","x":"Treating AI feature testing in staging the same as testing a typical CRUD feature — functional tests alone miss AI-specific quality regressions.","f":"What automated checks would you require to pass in staging before promoting a new prompt version to production?"},
  {"t":"Deployment & Production","m":8,"q":"How would you handle a complete outage of your primary LLM provider in production?","a":"Implement a fallback strategy: detect the outage via failed health checks or repeated request failures, then automatically route traffic to a backup provider/model (even if lower quality) or degrade gracefully with a clear, honest message to users rather than a hard failure. This requires designing your application from the start to not be hardcoded to a single provider's API.","w":"Tests resilience thinking — a recurring theme across this book's emphasis on designing for model swappability.","x":"Building a system tightly coupled to a single LLM provider's SDK and API, with no abstraction layer or fallback plan for an outage.","f":"How would you abstract your application code so swapping LLM providers doesn't require rewriting your business logic?"},
  {"t":"Git and GitHub","m":8,"q":"What's the difference between `git merge` and `git rebase`, and when would you use each?","a":"`git merge` combines two branches by creating a new merge commit, preserving the full history of both branches. `git rebase` rewrites your branch's commits on top of another branch's latest commits, producing a cleaner, linear history but altering commit history (which can be risky on shared branches). Use merge for shared/public branches where history should be preserved; use rebase for cleaning up your own local feature branch before opening a pull request.","w":"A standard Git fluency check that comes up even in AI-focused interviews, since collaboration skills are assumed baseline.","x":"Rebasing a shared branch that other people have already pulled and built on top of — this rewrites history and breaks their work.","f":"What would you do if a rebase introduced merge conflicts across many commits — how would you resolve them efficiently?"},
  {"t":"Git and GitHub","m":8,"q":"Why should API keys never be committed to a Git repository, and what would you do if one was accidentally committed?","a":"Committed secrets remain in the repository's history even after being deleted from the latest commit, and can be exposed publicly (especially on public repos) or accessed by anyone with repo access, leading to unauthorized usage and unexpected billing/security incidents. If accidentally committed, immediately revoke/rotate the exposed key at the provider, then remove it from Git history (not just delete the file in a new commit) using tools designed for that purpose.","w":"A frequently asked security-hygiene question — surprisingly common mistake even among experienced engineers.","x":"Believing that deleting a secret in a new commit fully removes it — the secret remains visible in the repository's commit history unless explicitly purged.","f":"What tool or technique would you use to fully remove a secret from Git history, not just the latest commit?"},
  {"t":"Git and GitHub","m":8,"q":"What makes a good README for an AI/ML project, from a hiring manager's perspective?","a":"A strong README explains what the project does and why, includes a clear architecture diagram or description, lists the tech stack and key design decisions (and the reasoning behind them), provides setup/run instructions that actually work, and ideally includes evaluation results or a demo. Hiring managers often judge a candidate's communication and production maturity from the README alone, before even running the code.","w":"Directly relevant to how interviewers and recruiters actually evaluate candidate GitHub profiles in practice.","x":"Submitting a project with no README, or one that's just a copy-pasted template with no explanation of actual design decisions.","f":"What's one thing you'd include in a README specifically to demonstrate production-readiness, not just functionality?"},
  {"t":"Git and GitHub","m":8,"q":"What's the purpose of a pull request, beyond just merging code?","a":"A pull request is a structured space for code review, discussion, and quality control before changes reach the main branch — catching bugs, sharing knowledge across the team, and maintaining a record of why a change was made (via the PR description and review comments), not just what changed.","w":"Tests collaborative engineering maturity, which AI Engineers need just as much as traditional software engineers.","x":"Treating PRs as a formality to merge quickly, writing minimal descriptions that don't explain the reasoning behind a change.","f":"What would you include in a PR description for a change that alters a production prompt's behavior?"},
  {"t":"REST APIs","m":8,"q":"What is idempotency, and why does it matter for an agent calling tools via REST APIs?","a":"An idempotent operation produces the same result no matter how many times it's executed (e.g. setting a value to 'X' is idempotent; incrementing a counter is not). This matters for agent tool calls because retries (due to timeouts or errors) are common — if a tool call isn't idempotent, a retry could cause unintended side effects, like double-charging a payment or sending a duplicate email.","w":"A frequently underestimated but critical concept once agents start taking real-world actions via tools.","x":"Designing or calling non-idempotent tools (like 'send payment') without any safeguard against accidental duplicate execution on retry.","f":"How would you make a non-idempotent operation safe to retry, using a technique like idempotency keys?"},
  {"t":"REST APIs","m":8,"q":"What's the difference between PUT and PATCH, and which would you use to update a user's chat preferences?","a":"PUT replaces an entire resource with the data provided (you must send the full object, even unchanged fields). PATCH applies a partial update, modifying only the specified fields. For updating a single chat preference (like 'enable streaming responses'), PATCH is more appropriate since you're changing one field without needing to resend the entire user preferences object.","w":"A standard REST fundamentals check that AI Engineering interviews still include given the heavy API surface in this role.","x":"Using PUT for partial updates, forcing clients to always send the complete resource even when changing just one small field — fragile and easy to accidentally overwrite other fields.","f":"What HTTP status code would you return for a successful PATCH request, and why does that matter to API consumers?"},
  {"t":"REST APIs","m":8,"q":"How would you design a REST API contract for a tool an AI agent will call, to minimize the chance of the agent calling it incorrectly?","a":"Use clear, descriptive endpoint names and parameter names, strict and well-documented type contracts (via OpenAPI/Swagger), narrow and specific endpoints rather than a single overloaded endpoint with many optional parameters, and clear, structured error responses so the agent (or your code wrapping its tool calls) can understand and recover from failures.","w":"Tests whether you connect REST API design principles specifically to the unique constraints of agent tool calling.","x":"Designing an overly flexible, single 'do anything' endpoint with many ambiguous optional parameters — increases the chance an LLM agent misuses it.","f":"How would good OpenAPI documentation specifically help an LLM agent choose the correct tool and parameters?"},
  {"t":"REST APIs","m":8,"q":"What's the difference between authentication and authorization, and where does each typically happen in a REST API?","a":"Authentication verifies who is making the request (e.g. validating an API key or JWT token). Authorization determines what that authenticated identity is allowed to do (e.g. can this user access this specific resource). Authentication typically happens early in request processing (often as middleware), while authorization checks often happen closer to the specific business logic, since permissions can vary by resource or action.","w":"A standard backend security fundamentals question that applies directly to securing AI agent tool access too.","x":"Conflating the two — assuming that because a request is authenticated, it's automatically authorized to perform any action.","f":"How would you design authorization specifically for an AI agent acting on behalf of a user, to ensure it can't exceed that user's own permissions?"},
  {"t":"Docker","m":8,"q":"What is a multi-stage Docker build, and why does it matter for AI application images?","a":"A multi-stage build uses multiple `FROM` stages in a single Dockerfile — one stage to build/compile dependencies (which may need heavy build tools), and a final, much leaner stage that copies only the necessary artifacts, discarding build tools and intermediate files. This matters for AI applications because Python ML/AI dependencies can be large, and a leaner final image means faster deployments and reduced attack surface.","w":"A practical, frequently tested Docker optimization technique relevant to any production deployment.","x":"Shipping a single-stage image that includes all build tools and intermediate artifacts in the final production image, bloating size unnecessarily.","f":"How would you decide what to keep versus discard between the build stage and the final stage of a multi-stage Dockerfile?"},
  {"t":"Docker","m":8,"q":"How would you debug a Docker container that exits immediately after starting?","a":"Check the container logs first (`docker logs <container>`), which often reveal a crash error or misconfiguration. If logs aren't sufficient, run the container interactively with an overridden entrypoint (e.g. `docker run -it --entrypoint /bin/bash <image>`) to inspect the filesystem and manually run the startup command to see the actual error.","w":"A hands-on debugging question frequently asked live in interviews to test practical Docker fluency, not just theory.","x":"Assuming the container 'just doesn't work' without checking logs first — logs almost always reveal the immediate cause.","f":"What would you check if the container starts successfully but the application inside it can't reach the database?"},
  {"t":"Docker","m":8,"q":"What's the purpose of `docker-compose`, and why is it commonly used for AI backend development?","a":"`docker-compose` defines and orchestrates multiple related containers (like your FastAPI app, PostgreSQL, and Redis) as a single, coordinated stack with one configuration file, handling networking between them automatically. This is especially useful for AI backends, which typically depend on several services together (API, database, cache, sometimes a vector DB) that need to be spun up consistently for local development.","w":"Tests practical, full-stack Docker knowledge relevant to the multi-service nature of most AI backend projects.","x":"Manually starting and networking multiple separate containers by hand instead of defining the stack declaratively in docker-compose.","f":"How would you structure docker-compose to support different configurations for local development versus production?"},
